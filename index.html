<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | Social links profile</title>


</head>
<body>

  <div class="social-links-profile">
    <div class="social-links-profile__container">
      <img class="social-links-profile__profile-img" src="assets/images/avatar-jessica.jpeg" alt="profile image of jessica randall"/>
      <p class="social-links-profile__name">Jessica Randall</p>
      <p class="social-links-profile__location">London, United Kingdom</p>
      <p class="social-links-profile__position">"Front-end developer and avid reader."</p>
      <div class="social-links-profile__buttons">
        <button class="social-links-profile__button github">Github</button>
        <button class="social-links-profile__button frontend-mentor">Frontend Mentor</button>
        <button class="social-links-profile__button linkedin">LinkedIn</button>
        <button class="social-links-profile__button twitter">Twitter</button>
        <button class="social-links-profile__button instagram">Instagram</button>
      </div>
    </div>
  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
